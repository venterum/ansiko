[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ansiko"
version = "0.3.0"
description = "Stream a Linux PTY or board to a dumb Android display"
readme = { text = "Ansiko turns an old Android phone into a read-only glass terminal for a Linux machine. Install the server with `uv tool install ./server`, or run it from a checkout. The daemon serves a web dashboard and the phone connects over WebSocket.", content-type = "text/markdown" }
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Ansiko contributors" }]
keywords = ["terminal", "android", "display", "pty", "dashboard", "widgets"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Terminals",
]
dependencies = ["aiohttp>=3.9", "segno>=1.6"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=1.0", "ruff>=0.8"]
widgets = ["Pillow>=10"]

[project.urls]
Homepage = "https://github.com/venterum/ansiko"
Issues = "https://github.com/venterum/ansiko/issues"

[project.scripts]
ansiko = "ansiko.cli:main"

[tool.setuptools]
packages = ["ansiko"]

[tool.setuptools.package-data]
ansiko = ["web/*", "web/fonts/*", "resources/boards/*/*", "resources/widgets/*/*"]

[tool.ruff]
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
