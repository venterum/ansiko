[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ansiko"
version = "0.2.0"
description = "Stream a Linux PTY or board to a dumb Android display"
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.9", "segno>=1.6"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=1.0", "ruff>=0.8"]

[project.scripts]
ansiko = "ansiko.cli:main"

[tool.setuptools]
packages = ["ansiko"]

[tool.setuptools.package-data]
ansiko = ["web/*"]

[tool.ruff]
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
