name        = "погода"
description = "Текущая погода через Open-Meteo; координаты и город — в этом файле"
command     = "./run.py"
interval    = 60
width       = 30
height      = 10
timeout     = 6
latitude    = 59.9343
longitude   = 30.3351
city        = "САНКТ-ПЕТЕРБУРГ"
timezone    = "Europe/Moscow"

[[settings]]
key = "city"
type = "text"
label = "City"
default = "САНКТ-ПЕТЕРБУРГ"

[[settings]]
key = "latitude"
type = "number"
label = "Latitude"
min = -90
max = 90
step = 0.0001
default = 59.9343

[[settings]]
key = "longitude"
type = "number"
label = "Longitude"
min = -180
max = 180
step = 0.0001
default = 30.3351

[[settings]]
key = "timezone"
type = "text"
label = "Timezone"
default = "Europe/Moscow"
